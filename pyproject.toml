[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-web-search-mcp"
version = "0.1.0"
description = "A multi-provider web search layer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jerry Liu"}]
keywords = ["ai-agents", "llm", "mcp", "web-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["ddgs>=9.0", "mcp>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/JerryLiu369/agent-web-search"
Repository = "https://github.com/JerryLiu369/agent-web-search"
Issues = "https://github.com/JerryLiu369/agent-web-search/issues"

[project.optional-dependencies]
ddgs = ["ddgs>=9.0"]
mcp = ["mcp>=2.0,<3"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6", "twine>=5"]

[project.scripts]
agent-web-search = "agent_web_search.cli:main"
agent-web-search-mcp = "agent_web_search.mcp:main"

[tool.setuptools.packages.find]
include = ["agent_web_search*"]

[tool.ruff]
exclude = [".git", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
