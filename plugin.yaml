name: agent-web-search
version: 0.7.3
description: Multi-provider web search for Hermes — independent search and grounding backends.
author: Jerry Liu
license: MIT
homepage: https://github.com/JerryLiu369/agent-web-search
kind: standalone
optional_env:
  - AGENT_WEB_SEARCH_PROVIDERS
  - AGENT_WEB_SEARCH_TIMEOUT
  - AGENT_WEB_SEARCH_MCP_TRANSPORT
  - AGENT_WEB_SEARCH_HTTP_HOST
  - AGENT_WEB_SEARCH_HTTP_PORT
  - AGENT_WEB_SEARCH_AUTH_TOKEN
  - AGENT_WEB_SEARCH_ALLOW_ANONYMOUS
  - AGENT_WEB_SEARCH_HTTP_ALLOWED_HOSTS
  - AGENT_WEB_SEARCH_HTTP_ALLOWED_ORIGINS
  - EXA_API_KEY
  - EXA_MCP_URL
  - PARALLEL_API_KEY
  - AGENT_WEB_SEARCH_CODEX_ALPHA_ENDPOINT
  - AGENT_WEB_SEARCH_CODEX_ALPHA_API_KEY
  - AGENT_WEB_SEARCH_CODEX_ALPHA_MODEL
  - DEEPSEEK_API_KEY
  - AGENT_WEB_SEARCH_DEEPSEEK_BASE_URL
  - AGENT_WEB_SEARCH_DEEPSEEK_MODELS
  - ARK_API_KEY
  - AGENT_WEB_SEARCH_ARK_MODELS
  - GEMINI_API_KEY
  - AGENT_WEB_SEARCH_GEMINI_MODELS
  - XAI_API_KEY
  - AGENT_WEB_SEARCH_GROK_MODELS
  - ZHIPU_CHAT_SEARCH_API_KEY
  - AGENT_WEB_SEARCH_ZHIPU_CHAT_BASE_URL
  - AGENT_WEB_SEARCH_ZHIPU_CHAT_MODELS
  - BRAVE_SEARCH_API_KEY
  - PERPLEXITY_API_KEY
  - TAVILY_API_KEY
  - YDC_API_KEY
  - ZHIPU_WEB_SEARCH_API_KEY
  - AGENT_WEB_SEARCH_ZHIPU_WEB_SEARCH_BASE_URL
python_dependencies:
  - ddgs>=9.0
provides_tools:
  - web_search
