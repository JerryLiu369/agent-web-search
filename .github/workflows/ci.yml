name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install --upgrade --editable ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.6"

      - name: Run Ruff
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  container:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag agent-web-search:ci .

  package:
    name: Verify wheel installation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build distributions
        run: python -m pip install --upgrade build && python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install dist/*.whl

      - name: Smoke-test installed entry points and HTTP app
        env:
          AGENT_WEB_SEARCH_AUTH_TOKEN: ci-token-with-at-least-32-characters
        run: |
          .package-venv/bin/agent-web-search --version
          .package-venv/bin/python -c "from agent_web_search.mcp import create_mcp_server; from agent_web_search.mcp_http import create_http_app; from starlette.testclient import TestClient; app = create_http_app(server=create_mcp_server()); client = TestClient(app); assert client.get('/healthz').json()['stateless'] is True"
